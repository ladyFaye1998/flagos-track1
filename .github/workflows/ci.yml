name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-cpu:
    name: Tests on CPU (Triton optional)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pytest

      - name: Smoke - import + CLI
        run: |
          python -c "import flagos_track1; print('ops:', len(flagos_track1.OP_REGISTRY))"
          flagos info
          flagos list

      - name: Run test suite (CPU fallback paths)
        run: pytest tests/ -q --tb=short -p no:recording
